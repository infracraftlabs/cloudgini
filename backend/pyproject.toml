[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudgini"
version = "0.1.0"
description = "Cloud cost optimisation, unused-resource cleanup and security checks with safe, approved remediation."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-asset>=3.26,<4",
    "google-cloud-monitoring>=2.22,<3",
    "google-cloud-bigquery>=3.25,<4",
    "google-cloud-securitycenter>=1.33,<2",
    "google-cloud-compute>=1.19,<2",
    "google-cloud-storage>=2.18,<4",
]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not postgres and not live'"
markers = [
    "postgres: needs the docker compose PostgreSQL (CLOUDGINI_TEST_DATABASE_URL)",
    "live: calls a real cloud or model API (skipped by default)",
]
