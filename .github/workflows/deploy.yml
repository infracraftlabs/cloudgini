# Manual deploy to Cloud Run. Uses Workload Identity Federation (no service account keys).
# Configure the repository variables listed in docs/terraform.md before running.
name: deploy
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/cloudgini
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: |
          docker build -t "$REPO/backend:$GITHUB_SHA" backend && docker push "$REPO/backend:$GITHUB_SHA"
          docker build -t "$REPO/frontend:$GITHUB_SHA" frontend && docker push "$REPO/frontend:$GITHUB_SHA"
      - run: |
          gcloud run deploy cloudgini-backend --region "$REGION" --image "$REPO/backend:$GITHUB_SHA" --quiet
          gcloud run deploy cloudgini-frontend --region "$REGION" --image "$REPO/frontend:$GITHUB_SHA" --quiet
