# Local development. Ports are bound to 127.0.0.1 only. Run scripts/init-env.sh first.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudgini
      POSTGRES_USER: cloudgini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudgini"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      CLOUDGINI_DATABASE_URL: postgresql+psycopg://cloudgini:${POSTGRES_PASSWORD}@db:5432/cloudgini
      CLOUDGINI_API_KEYS: ${CLOUDGINI_API_KEYS:?run scripts/init-env.sh first}
      CLOUDGINI_GCP_PROJECTS: ${CLOUDGINI_GCP_PROJECTS:-}
      CLOUDGINI_GCP_BILLING_TABLE: ${CLOUDGINI_GCP_BILLING_TABLE:-}
      CLOUDGINI_CORS_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["127.0.0.1:8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
